<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Matematika Kelas IV</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--tx:#1f2547;--mu:#6b7194;--pr:#5b4de0;--pr2:#8b5cf6;--ok:#12a36b;--okb:#dcf7ea;--bad:#e5484d;--badb:#fde8e9;--bd:#dfe4f5;--sh:0 10px 30px rgba(60,60,140,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--card:#1d2040;--tx:#eceefd;--mu:#9a9fc8;--pr:#8a7dff;--pr2:#b18cff;--ok:#34d399;--okb:#12352b;--bad:#ff6b70;--badb:#3a1f27;--bd:#303560;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142b;--card:#1d2040;--tx:#eceefd;--mu:#9a9fc8;--pr:#8a7dff;--pr2:#b18cff;--ok:#34d399;--okb:#12352b;--bad:#ff6b70;--badb:#3a1f27;--bd:#303560;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5;
background-image:radial-gradient(circle at 10% 0,rgba(139,92,246,.18),transparent 40%),radial-gradient(circle at 100% 100%,rgba(91,77,224,.16),transparent 40%)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:24px;border:1px solid var(--bd)}
.hero{text-align:center}
.logo{font-size:64px;line-height:1}
h1{margin:10px 0 4px;font-size:28px;background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:13px}
input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:8px 0 14px;outline:none}
input:focus{border-color:var(--pr)}
.btn{border:0;cursor:pointer;font-size:17px;font-weight:700;padding:14px 26px;border-radius:14px;color:#fff;background:linear-gradient(90deg,var(--pr),var(--pr2));box-shadow:0 6px 16px rgba(91,77,224,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--bg);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:14px}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:99px;transition:width .4s}
.q{font-size:18px;font-weight:600;margin:6px 0 18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--pr);transform:translateX(3px)}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--bd);font-size:14px}
.opt.sel{border-color:var(--pr);background:var(--card);box-shadow:0 0 0 3px rgba(91,77,224,.2)}
.opt.sel b{background:var(--pr);border-color:var(--pr);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;justify-content:center}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:11px;color:var(--mu);cursor:pointer}
.dot.done{background:var(--pr);color:#fff;border-color:var(--pr)}.dot.cur{outline:2px solid var(--pr2);outline-offset:1px}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--pr) calc(var(--p)*1%),var(--bd) 0)}
.ring div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring strong{font-size:46px;line-height:1}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;border-radius:14px;padding:12px;text-align:center;font-size:13px}
.stat b{display:block;font-size:24px}
.ok{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.neu{background:var(--bg);color:var(--mu)}
.rv{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;border-left:6px solid var(--ok)}
.rv.x{border-left-color:var(--bad)}
.rv p{margin:0 0 6px;font-weight:600}
.rv span{display:block}.g{color:var(--ok)}.r{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
 <div id="start" class="card hero">
  <div class="logo">➕✖️📐</div>
  <h1>Kuis Matematika Kelas IV</h1>
  <div class="mu">Sumatif Harian Matematika · Fase B · Semester Ganjil</div>
  <div class="chips"><span class="chip">📝 33 Soal Pilihan Ganda</span><span class="chip">⭐ Skor 0–100</span><span class="chip">📖 Ada Pembahasan</span></div>
  <input id="nama" placeholder="Tulis namamu di sini…" maxlength="40" autocomplete="off">
  <button class="btn" id="go">Mulai Ujian 🚀</button>
 </div>

 <div id="quiz" class="card hide">
  <div class="top"><span id="who"></span><span id="cnt"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div class="nav">
   <button class="btn ghost" id="prev">← Sebelumnya</button>
   <button class="btn" id="next">Selanjutnya →</button>
  </div>
  <div class="dots" id="dots"></div>
 </div>

 <div id="res" class="card hide hero">
  <div class="logo" id="em"></div>
  <h1 id="msg"></h1>
  <div class="mu" id="nm"></div>
  <div class="ring" id="ring"><div><strong id="sc"></strong><span class="mu">dari 100</span></div></div>
  <div class="stats">
   <div class="stat ok"><b id="sb"></b>Benar</div>
   <div class="stat bad"><b id="ss"></b>Salah</div>
   <div class="stat neu"><b id="sk"></b>Kosong</div>
  </div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px">
   <button class="btn" id="again">Ulangi Ujian 🔄</button>
   <button class="btn ghost" id="tog">Lihat Pembahasan</button>
  </div>
  <div id="rev" class="hide" style="text-align:left"></div>
 </div>
</div>

<script>
const Q=[
["Lambang bilangan dari “enam ribu tujuh ratus lima puluh” adalah ...", ["6.075", "6.570", "6.750", "7.650"], 2],
["Pada bilangan 8.742, angka 7 menempati nilai tempat ...", ["ribuan", "ratusan", "puluhan", "satuan"], 1],
["Bilangan 5.409 dibaca ...", ["lima ribu empat ratus sembilan", "lima ribu empat ratus sembilan puluh", "lima ribu empat puluh sembilan", "lima ribu empat ratus sembilan belas"], 0],
["Tanda perbandingan yang tepat untuk mengisi titik-titik pada 4.825 ... 4.852 adalah ...", [">", "<", "=", "≥"], 1],
["Urutan bilangan 3.450, 3.250, 3.650, 3.150 dari yang terkecil ke terbesar adalah ...", ["3.650, 3.450, 3.250, 3.150", "3.150, 3.450, 3.250, 3.650", "3.150, 3.250, 3.450, 3.650", "3.250, 3.150, 3.450, 3.650"], 2],
["Harga susu di Toko A adalah Rp5.000, di Toko B Rp6.750, dan di Toko C Rp5.500. Toko yang menjual susu dengan harga paling murah adalah ...", ["Toko B", "Toko C", "Toko A", "Toko B dan C"], 2],
["Hasil pengurangan bersusun dari 573 – 268 adalah ...", ["305", "315", "205", "308"], 0],
["SD Jaya Terus mengirimkan 256 siswa untuk mengikuti lomba matematika. Jika 179 siswa di antaranya adalah siswa laki-laki, maka banyaknya siswa perempuan adalah ...", ["67 siswa", "77 siswa", "87 siswa", "97 siswa"], 1],
["Slamet memiliki 111 kelereng, lalu mendapat hadiah 36 kelereng dari kakaknya. Slamet kemudian memberikan 54 kelereng kepada Asep. Banyaknya kelereng Slamet sekarang adalah ...", ["83 kelereng", "93 kelereng", "103 kelereng", "147 kelereng"], 1],
["Hasil dari perkalian 32 × 3 adalah ...", ["86", "96", "98", "106"], 1],
["Terdapat 24 botol air mineral dalam satu karton. Banyaknya botol air mineral dalam 8 karton adalah ...", ["162 botol", "182 botol", "192 botol", "202 botol"], 2],
["Hasil perkalian 45 × 5 adalah ...", ["205", "215", "225", "235"], 2],
["Hasil dari 72 : 3 adalah ...", ["22", "24", "26", "28"], 1],
["Pak Guru membeli 3 pak permen yang masing-masing berisi 30 permen. Jika permen tersebut dibagikan sama rata kepada 5 siswa, banyaknya permen yang diterima setiap siswa adalah ...", ["12 permen", "15 permen", "18 permen", "20 permen"], 2],
["Hasil dari pembagian 70 : 5 adalah ...", ["12", "14", "15", "16"], 1],
["Faktor dari bilangan 27 adalah ...", ["1, 3, 9, 27", "1, 3, 6, 27", "1, 2, 9, 27", "3, 9, 27"], 0],
["Kelipatan dari 3 yang nilainya kurang dari 30 adalah ...", ["3, 6, 9, 12, 15, 18, 21, 24, 27", "3, 6, 9, 12, 15, 18, 21, 24, 27, 30", "6, 12, 18, 24", "3, 9, 15, 21, 27"], 0],
["Kelipatan dari 4 yang lebih dari 7 dan kurang dari 25 adalah ...", ["4, 8, 12, 16, 20, 24", "8, 12, 16, 20, 24", "8, 12, 16, 20", "12, 16, 20, 24"], 1],
["Perbandingan yang tepat untuk mengisi titik-titik pada ½ ... ¼ adalah ...", ["<", ">", "=", "≤"], 1],
["Perbandingan antara pecahan ²⁄₁₀ dan ¹⁄₁₀ adalah ...", ["²⁄₁₀ < ¹⁄₁₀", "²⁄₁₀ > ¹⁄₁₀", "²⁄₁₀ = ¹⁄₁₀", "²⁄₁₀ ≤ ¹⁄₁₀"], 1],
["Urutan pecahan ⅛, ⅝, ⅜ dari yang terkecil ke terbesar adalah ...", ["⅝, ⅜, ⅛", "⅛, ⅜, ⅝", "⅜, ⅛, ⅝", "⅛, ⅝, ⅜"], 1],
["Pecahan yang senilai dengan ½ adalah ...", ["⅔", "²⁄₄", "⅗", "⁴⁄₆"], 1],
["Bentuk paling sederhana dari pecahan ⁶⁄₁₂ adalah ...", ["½", "⅓", "⅔", "¾"], 0],
["Jika pecahan ¾ diubah menjadi pecahan senilai berpenyebut 12, maka pembilangnya menjadi ...", ["6", "8", "9", "10"], 2],
["Bentuk desimal dari pecahan ³⁄₁₀ adalah ...", ["0,03", "0,3", "3,0", "0,33"], 1],
["Bentuk pecahan persepuluhan dari desimal 0,7 adalah ...", ["⁷⁄₁₀₀", "⁷⁄₁₀", "¹⁄₇", "⁷⁰⁄₁₀"], 1],
["Bentuk desimal dari pecahan ²⁵⁄₁₀₀ adalah ...", ["0,25", "2,5", "0,025", "25,0"], 0],
["Bentuk persen dari pecahan ⁴⁵⁄₁₀₀ adalah ...", ["4,5%", "45%", "450%", "0,45%"], 1],
["Nazilla dapat menjawab dengan benar 6 pertanyaan dari 10 soal yang diberikan. Persentase soal yang dijawab benar oleh Nazilla adalah ...", ["50%", "60%", "70%", "80%"], 1],
["Bentuk pecahan perseratusan dari 75% adalah ...", ["⁷⁵⁄₁₀", "⁷⁵⁄₁₀₀", "⁷,⁵⁄₁₀₀", "⁷⁵⁰⁄₁₀₀"], 1],
["Perhatikan pola bilangan membesar berikut: 5, 9, 13, 17, ... Bilangan berikutnya yang tepat untuk melengkapi pola tersebut adalah ...", ["19", "20", "21", "22"], 2],
["Perhatikan pola bilangan mengecil berikut: 34, 27, 20, 13, ... Bilangan berikutnya untuk melengkapi pola tersebut adalah ...", ["6", "7", "8", "9"], 0],
["Ali menata buku pada rak perpustakaan. Pada rak pertama ia menata 5 buku, rak kedua 9 buku, dan rak ketiga 13 buku. Banyaknya buku yang ditata Ali pada rak kelima sesuai pola tersebut adalah ...", ["17 buku", "19 buku", "21 buku", "23 buku"], 2]
];
const L="ABCD",N=Q.length,$=id=>document.getElementById(id);
let A,cur,nama;
function show(id){["start","quiz","res"].forEach(x=>$(x).classList.toggle("hide",x!==id));window.scrollTo(0,0)}
function start(){nama=$("nama").value.trim()||"Siswa";A=Array(N).fill(-1);cur=0;$("who").textContent="👤 "+nama;show("quiz");render()}
function render(){
 const q=Q[cur];
 $("cnt").textContent="Soal "+(cur+1)+" / "+N;
 $("pb").style.width=(A.filter(a=>a>=0).length/N*100)+"%";
 $("qt").textContent=(cur+1)+". "+q[0];
 $("opts").innerHTML=q[1].map((t,i)=>`<button class="opt ${A[cur]===i?"sel":""}" data-i="${i}"><b>${L[i]}</b><span>${t}</span></button>`).join("");
 $("prev").disabled=cur===0;
 $("next").textContent=cur===N-1?"Selesai ✅":"Selanjutnya →";
 $("dots").innerHTML=Q.map((_,i)=>`<button class="dot ${A[i]>=0?"done":""} ${i===cur?"cur":""}" data-n="${i}">${i+1}</button>`).join("");
}
function finish(){
 const un=A.filter(a=>a<0).length;
 if(un&&!confirm("Masih ada "+un+" soal belum dijawab. Yakin ingin menyelesaikan ujian?"))return;
 const b=A.filter((a,i)=>a===Q[i][2]).length,k=un,s=N-b-k,score=Math.round(b/N*100);
 $("nm").textContent=nama;$("sc").textContent=score;$("sb").textContent=b;$("ss").textContent=s;$("sk").textContent=k;
 $("ring").style.setProperty("--p",score);
 const [e,m]=score>=90?["🏆","Luar Biasa!"]:score>=75?["🌟","Hebat, Kerja Bagus!"]:score>=60?["👍","Cukup Baik!"]:["💪","Ayo Belajar Lagi!"];
 $("em").textContent=e;$("msg").textContent=m;
 $("rev").innerHTML="<h3>Pembahasan</h3>"+Q.map((q,i)=>{const ok=A[i]===q[2];
  return `<div class="rv ${ok?"":"x"}"><p>${i+1}. ${q[0]}</p><span class="${ok?"g":"r"}">Jawabanmu: ${A[i]<0?"(kosong)":L[A[i]]+". "+q[1][A[i]]} ${ok?"✔":"✘"}</span>${ok?"":`<span class="g">Jawaban benar: ${L[q[2]]}. ${q[1][q[2]]}</span>`}</div>`}).join("");
 $("rev").classList.add("hide");$("tog").textContent="Lihat Pembahasan";
 show("res");
}
$("go").onclick=start;
$("nama").onkeydown=e=>{if(e.key==="Enter")start()};
$("opts").onclick=e=>{const o=e.target.closest(".opt");if(o){A[cur]=+o.dataset.i;render()}};
$("dots").onclick=e=>{const d=e.target.closest(".dot");if(d){cur=+d.dataset.n;render()}};
$("prev").onclick=()=>{if(cur>0){cur--;render()}};
$("next").onclick=()=>{if(cur<N-1){cur++;render()}else finish()};
$("again").onclick=()=>show("start");
$("tog").onclick=()=>{const h=$("rev").classList.toggle("hide");$("tog").textContent=h?"Lihat Pembahasan":"Sembunyikan Pembahasan"};
</script>
</body>
</html>
